<script>
// 独自ドメイン移行(pages.dev → g.rap-atlas.com)のlocalStorage引き継ぎ。
// 当初はiframe+postMessage方式だったが、最近のブラウザはサードパーティiframeの
// ストレージを分離する(Storage Partitioning)ため旧オリジンの実データが読めない。
// そこでトップレベルの往復リダイレクトで運ぶ:
//   新(初訪問・データ無し) → 旧/?gra-handoff → 旧が全gra.*キーをURLフラグメントに
//   載せて新/#gra-import=... へ戻す → 新が取り込んでURLを掃除、アプリ起動続行。
// フラグメントはサーバーに送信されないためデータが外部へ出ることはない。
// ループ防止はsessionStorage、bot(クローラー)はUAで除外、既存キーは上書きしない。
(function () {
  var OLD = 'https://gangsta-rap-atlas.pages.dev';
  var NEW = 'https://g.rap-atlas.com';
  var FLAG = 'gra.migrated.v2';
  function collect() {
    var d = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('gra.') === 0 && k.indexOf('gra.migrated') !== 0) d[k] = localStorage.getItem(k);
    }
    return d;
  }
  function enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
  function dec(t) { return JSON.parse(decodeURIComponent(escape(atob(t)))); }
  try {
    if (location.origin === OLD && location.search.indexOf('gra-handoff') >= 0) {
      var p = enc(collect());
      // フラグメント長の保険(通常は遠く及ばない)
      if (p.length > 800000) p = enc({ 'gra.streetName': localStorage.getItem('gra.streetName') || '', 'gra.lang': localStorage.getItem('gra.lang') || 'ja' });
      // 注意: ここでwindow.stop()を呼ぶと開始したばかりのナビゲーション自体が
      // キャンセルされる(実際にそれで引き継ぎが止まるバグになった)。
      // ナビゲーションがページを破棄するので後続読み込みの抑止は不要。
      location.replace(NEW + '/#gra-import=' + p);
      return;
    }
    if (location.origin !== NEW) return;
    if (location.hash.indexOf('#gra-import=') === 0) {
      var data = dec(location.hash.slice('#gra-import='.length));
      for (var k in data) {
        if (k.indexOf('gra.') === 0 && k.indexOf('gra.migrated') !== 0 && typeof data[k] === 'string' && localStorage.getItem(k) == null) localStorage.setItem(k, data[k]);
      }
      localStorage.setItem(FLAG, '1');
      // 引き継ぎ用フラグメントを消し、来訪時のURL(静的地域ページのパスや
      // 共有リンクのハッシュ)を復元する。後続のapp.jsがこのURLを読んで
      // 該当地域を開くので、往復を挟んでも着地体験は変わらない。
      var resume = sessionStorage.getItem('gra.resumePath') || (location.pathname + location.search);
      sessionStorage.removeItem('gra.resumePath');
      history.replaceState(null, '', resume);
      return;
    }
    if (localStorage.getItem(FLAG)) return;
    if (localStorage.getItem('gra.streetName')) { localStorage.setItem(FLAG, '1'); return; }
    if (/bot|crawler|spider|crawling|lighthouse/i.test(navigator.userAgent)) return;
    if (sessionStorage.getItem('gra.bounceTried')) { localStorage.setItem(FLAG, '1'); return; }
    sessionStorage.setItem('gra.bounceTried', '1');
    sessionStorage.setItem('gra.resumePath', location.pathname + location.search + location.hash);
    location.replace(OLD + '/?gra-handoff');
  } catch (e) {}
})();
</script>
