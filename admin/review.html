<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>REJECT救済レビュー(非公開)</title>
<style>
  :root { --paper: #e8e4d9; --ink: #14120f; --ink-2: #4a453c; --red: #c1272d; --gold: #b8912f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", Helvetica, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--paper); padding: 14px 16px; border-bottom: 3px solid var(--red); }
  header h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: .04em; }
  header p { margin: 0; font-size: 11px; color: #cfc9ba; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #ddd8c8; border-bottom: 2px solid var(--ink); position: sticky; top: 62px; z-index: 5; }
  .toolbar input[type="text"] { font: inherit; font-size: 13px; padding: 6px 8px; border: 2px solid var(--ink); background: var(--paper); flex: 1; min-width: 140px; }
  .toolbar select { font: inherit; font-size: 12px; padding: 5px 6px; border: 2px solid var(--ink); background: var(--paper); }
  .toolbar button { font: inherit; font-size: 12px; font-weight: 800; padding: 6px 12px; border: 2px solid var(--ink); background: var(--paper); cursor: pointer; }
  .toolbar button:hover { background: var(--ink); color: var(--paper); }
  .toolbar .stat { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  main { padding: 10px 16px 80px; max-width: 900px; margin: 0 auto; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 8px; border-bottom: 1px solid rgba(20,18,15,.15); }
  .row.done { opacity: .55; }
  .row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--red); cursor: pointer; }
  .row .main { flex: 1; min-width: 0; }
  .row .artist { font-weight: 900; font-size: 14px; }
  .row .releases { margin: 4px 0 0; font-size: 11px; color: var(--ink-2); line-height: 1.6; }
  .row .releases a { color: var(--ink-2); }
  .row .region { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .row select, .row input[type="text"].custom { font: inherit; font-size: 12px; padding: 4px 6px; border: 2px solid var(--ink); background: var(--paper); }
  .row select { min-width: 160px; }
  .row .pub { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .row .pub button { font: inherit; font-size: 11px; font-weight: 800; padding: 4px 10px; border: 2px solid var(--gold); background: transparent; color: var(--ink); cursor: pointer; }
  .row .pub button:hover { background: var(--gold); }
  .row .pub button:disabled { opacity: .5; cursor: default; background: transparent; }
  .row .pub .pubstat { font-size: 11px; color: var(--ink-2); }
  .row .pub .pubstat.on { color: var(--red); font-weight: 800; }
  .empty { padding: 40px; text-align: center; color: var(--ink-2); font-size: 13px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--paper); padding: 10px 16px; display: flex; gap: 10px; align-items: center; border-top: 3px solid var(--red); font-size: 12px; }
  footer button { font: inherit; font-weight: 800; padding: 8px 16px; border: 2px solid var(--paper); background: transparent; color: var(--paper); cursor: pointer; }
  footer button:hover { background: var(--paper); color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1>REJECT救済レビュー(非公開ページ)</h1>
  <p>トップページからはリンクしていません。チェックを入れて地域を選ぶと、その場でサーバーに保存されます(複数人・複数端末で同時に埋めていけます)。</p>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="アーティスト名で絞り込み">
  <select id="filterMode">
    <option value="all">すべて表示</option>
    <option value="undone">未確認のみ</option>
    <option value="checked">採用にした分のみ</option>
  </select>
  <select id="publishFilter">
    <option value="unpublished">未公開</option>
    <option value="published">公開済み</option>
    <option value="allPublish">公開状態: すべて</option>
  </select>
  <span class="stat">年代</span>
  <input type="number" id="yearMin" placeholder="下限" style="width:70px">
  〜
  <input type="number" id="yearMax" placeholder="上限(例: 1999)" style="width:110px">
  <select id="styleFilter"><option value="">スタイルタグ: すべて</option></select>
  <span class="stat" id="stat"></span>
  <span class="stat" id="saveStatus"></span>
  <button id="exportBtn">⬇ 選択結果を書き出す</button>
  <button id="publishAllBtn">📍 表示中の採用ぶんをまとめて公開</button>
  <span class="stat" id="publishStatus"></span>
</div>

<main id="list"><p class="empty">読み込み中…</p></main>
<datalist id="regionNames"></datalist>

<footer>
  <span id="footerStat"></span>
</footer>

<script>
// メインサイトと同じSupabaseプロジェクト・匿名anon書き込みモデル
// (stamps/tag_votes/fav_syncと同様、認証無し・即時UPSERT)。
// 複数人で同時にレビューを埋めていけるよう、ローカル保存ではなく
// review_decisionsテーブルへ即時保存する。
const SB_URL = 'https://xqtoyvhupioztljkejnw.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxdG95dmh1cGlvenRsamtlam53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mjc2MDgsImV4cCI6MjEwMTUwMzYwOH0.gW4xkwC3GzdKcnTT-490-75Sssx49wIIBcVOEW-MKHw';
const SB_HEADERS = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

const STORE_KEY = 'gra.admin.review.v1';
// 起動直後~サーバーから取得できるまでの間だけローカルキャッシュを見せる
// (体感の初期表示を速くするため。取得できたらサーバー側で上書きする)
const state = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); // { artist: { include: bool, regionId: string, custom: string } }
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));

let ARTISTS = [];
let REGIONS = [];
let saveStatusEl = null;
const PAGE_SIZE = 150;
let renderLimit = PAGE_SIZE;
const resetPageAndRender = () => { renderLimit = PAGE_SIZE; render(); };

// 「地図に公開」機能。data.js自体は書き換えず、published_regions/
// published_albumsへ書き込み、メインサイト側がそれを読み足して重ねて表示する。
let publishedMap = {}; // { artist: regionId } (公開済みなら入る)
let publishedRegionsCache = []; // 既にジオコーディング済みのカスタム地域(重複ジオコーディング回避用)
let publishStatusEl = null;
let lastFilteredItems = [];
const normalizeName = (s) => (s || '').trim().toLowerCase();

async function loadPublishedState() {
  try {
    const [albumsRes, regionsRes] = await Promise.all([
      fetch(`${SB_URL}/published_albums?select=source_artist,region_id`, { headers: SB_HEADERS }),
      fetch(`${SB_URL}/published_regions?select=id,name,area,lat,lng`, { headers: SB_HEADERS }),
    ]);
    if (albumsRes.ok) {
      publishedMap = {};
      (await albumsRes.json()).forEach((r) => { publishedMap[r.source_artist] = r.region_id; });
    }
    if (regionsRes.ok) publishedRegionsCache = await regionsRes.json();
  } catch { /* 公開状態が引けなくても閲覧自体は継続する */ }
}

// Nominatim(OSM)で1件だけジオコーディングする。人が1件ずつボタンを押して
// 呼ぶ想定の低頻度アクセスなので、収集スクリプト側のような専用レート制御は
// 設けていない(連打だけはボタンのdisabledで抑止する)。
async function geocodePlace(place) {
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&q=${encodeURIComponent(place)}`);
  if (!res.ok) return null;
  const rows = await res.json();
  if (!rows.length) return null;
  const r = rows[0];
  const addr = r.address || {};
  const areaBits = [addr.state, addr.country].filter(Boolean);
  return { lat: parseFloat(r.lat), lng: parseFloat(r.lon), area: areaBits.join(', ') || 'CUSTOM' };
}

// レビューでの地域指定(既存地域 or 自由入力の地名)を、地図で使えるregion_id
// に解決する。自由入力の地名は、既存地域名・過去に公開済みの地名と表記が
// 一致すればそれを再利用し、無ければ新規にジオコーディングして
// published_regionsへ追加する。
async function resolveRegionForPublish(decision) {
  if (decision.regionId) return decision.regionId;
  const customName = (decision.custom || '').trim();
  if (!customName) return null;
  const existing = REGIONS.find((r) => normalizeName(r.name) === normalizeName(customName));
  if (existing) return existing.id;
  const already = publishedRegionsCache.find((r) => normalizeName(r.name) === normalizeName(customName));
  if (already) return already.id;
  const geo = await geocodePlace(customName);
  if (!geo) throw new Error(`ジオコーディングに失敗しました: ${customName}`);
  const slug = customName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'region';
  let id = `custom-${slug}`;
  let n = 2;
  while (REGIONS.some((r) => r.id === id) || publishedRegionsCache.some((r) => r.id === id)) id = `custom-${slug}-${n++}`;
  const row = { id, name: customName, area: geo.area, lat: geo.lat, lng: geo.lng };
  const res = await fetch(`${SB_URL}/published_regions`, {
    method: 'POST',
    headers: { ...SB_HEADERS, Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(row),
  });
  if (!res.ok) throw new Error(`地域の保存に失敗しました: ${customName}`);
  publishedRegionsCache.push(row);
  return id;
}

// 1アーティスト分(=その候補に載っている全リリース)を公開/更新する。
// discogs_release_idをキーにUPSERTするので、地域を直してからもう一度
// 実行すれば同じ行が上書きされる(=あとからの修正にそのまま対応できる)。
async function publishArtist(a) {
  const decision = state[a.artist];
  if (!decision?.include) throw new Error('採用チェックが入っていません');
  const regionId = await resolveRegionForPublish(decision);
  if (!regionId) throw new Error('地域が未指定です');
  const rows = a.releases.map((r) => ({
    source_artist: a.artist,
    discogs_release_id: String(r.id),
    title: r.title, artist: a.artist, year: r.year || null, label: r.label,
    discogs_url: r.url, region_id: regionId, updated_at: new Date().toISOString(),
  }));
  const res = await fetch(`${SB_URL}/published_albums`, {
    method: 'POST',
    headers: { ...SB_HEADERS, Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(rows),
  });
  if (!res.ok) throw new Error('公開の保存に失敗しました');
  publishedMap[a.artist] = regionId;
}

// 採用が外された(include=false)のに公開済みのままのものを取り下げる。
async function unpublishArtist(a) {
  await fetch(`${SB_URL}/published_albums?source_artist=eq.${encodeURIComponent(a.artist)}`, {
    method: 'DELETE', headers: SB_HEADERS,
  });
  delete publishedMap[a.artist];
}

async function loadServerState() {
  try {
    const res = await fetch(`${SB_URL}/review_decisions?select=artist,include,region_id,custom_region`, { headers: SB_HEADERS });
    if (!res.ok) return;
    (await res.json()).forEach((r) => {
      state[r.artist] = { include: r.include, regionId: r.region_id, custom: r.custom_region };
    });
    save();
  } catch { /* サーバーに繋がらなくてもローカルキャッシュだけで見られるようにする */ }
}

async function pushDecision(artist, decision) {
  if (saveStatusEl) { saveStatusEl.textContent = '保存中…'; }
  try {
    const res = await fetch(`${SB_URL}/review_decisions`, {
      method: 'POST',
      headers: { ...SB_HEADERS, Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({
        artist, include: decision.include, region_id: decision.regionId, custom_region: decision.custom,
        updated_at: new Date().toISOString(),
      }),
    });
    if (saveStatusEl) saveStatusEl.textContent = res.ok ? '保存済み' : '保存失敗(オフライン?)';
  } catch {
    if (saveStatusEl) saveStatusEl.textContent = '保存失敗(オフライン?)';
  }
}

async function boot() {
  saveStatusEl = document.getElementById('saveStatus');
  publishStatusEl = document.getElementById('publishStatus');
  const [artistsRes, regionsRes] = await Promise.all([
    fetch('candidates.json'), fetch('regions.json'),
  ]);
  ARTISTS = await artistsRes.json();
  REGIONS = await regionsRes.json();
  populateStyleFilter();
  buildRegionOptionsHtml();
  render();
  await Promise.all([loadServerState(), loadPublishedState()]);
  render(); // サーバー側の最新状態(他の人の入力分・公開状態も含む)で再描画
}

// 各リリースに付いてるDiscogsスタイルタグを集計し、頻度順でドロップダウンに出す。
// Memphis Rap/Phonkのように、Gangsta/G-Funkと重なるが必ずしもガンスタ色が
// はっきりしないタグだけを抜き出して確認したい時用。
function populateStyleFilter() {
  const counts = {};
  ARTISTS.forEach((a) => a.releases.forEach((r) => (r.styles || []).forEach((s) => {
    counts[s] = (counts[s] || 0) + 1;
  })));
  const sel = document.getElementById('styleFilter');
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([style, n]) => {
    const opt = document.createElement('option');
    opt.value = style;
    opt.textContent = `${style}(${n})`;
    sel.appendChild(opt);
  });
}

// 280件近い地域の<option>を行ごとに毎回文字列生成すると、全件表示時に
// 数百万ノード分のHTML解析が走ってページが固まっていた。共通HTMLは
// 一度だけ作っておき、選択状態は後からselect.valueで当てる。
let REGION_OPTIONS_HTML = '';
function buildRegionOptionsHtml() {
  const opts = ['<option value="">-- 地域を選ぶ --</option>'];
  REGIONS.filter((r) => !r.unclassified)
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name)) // 州名(area)ではなく都市名(name)順
    .forEach((r) => {
      opts.push(`<option value="${r.id}">${r.name}(${r.area}）</option>`);
    });
  REGION_OPTIONS_HTML = opts.join('');

  // 自由入力欄からも既存の地名をサジェストできるように(datalist)。
  // 都市名が重複する地域(例: 同名の別州の街)もあるので、選ばれた時にどれを
  // 指すかは分からない前提 — あくまで入力補助・タイプミス防止用。
  const datalist = document.getElementById('regionNames');
  const seen = new Set();
  const dOpts = [];
  REGIONS.filter((r) => !r.unclassified).forEach((r) => {
    if (seen.has(r.name)) return;
    seen.add(r.name);
    dOpts.push(`<option value="${r.name}">`);
  });
  datalist.innerHTML = dOpts.join('');
}

function render() {
  const list = document.getElementById('list');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const mode = document.getElementById('filterMode').value;
  let items = ARTISTS;
  if (q) items = items.filter((a) => a.artist.toLowerCase().includes(q));
  if (mode === 'undone') items = items.filter((a) => !state[a.artist]);
  if (mode === 'checked') items = items.filter((a) => state[a.artist]?.include);
  // Phonk等、ジャンルが派生して境界が曖昧になった後の年代を除外して、
  // まず古い(=ガンスタ色がはっきりしてる)年代だけレビューできるように。
  // どちらか1つのリリースでも範囲内ならそのアーティストごと表示する。
  const yMin = parseInt(document.getElementById('yearMin').value, 10);
  const yMax = parseInt(document.getElementById('yearMax').value, 10);
  if (!isNaN(yMin) || !isNaN(yMax)) {
    items = items.filter((a) => a.releases.some((r) => {
      if (!r.year) return false;
      if (!isNaN(yMin) && r.year < yMin) return false;
      if (!isNaN(yMax) && r.year > yMax) return false;
      return true;
    }));
  }
  const style = document.getElementById('styleFilter').value;
  if (style) items = items.filter((a) => a.releases.some((r) => (r.styles || []).includes(style)));
  const publishMode = document.getElementById('publishFilter').value;
  if (publishMode === 'unpublished') items = items.filter((a) => !publishedMap[a.artist]);
  else if (publishMode === 'published') items = items.filter((a) => !!publishedMap[a.artist]);

  const doneCount = Object.keys(state).length;
  document.getElementById('stat').textContent = `${doneCount}/${ARTISTS.length} 確認済み`;
  const checkedCount = Object.values(state).filter((s) => s.include).length;
  document.getElementById('footerStat').textContent =
    `全${ARTISTS.length}組 / 確認済み${doneCount} / 採用${checkedCount}`;

  lastFilteredItems = items;
  if (!items.length) { list.innerHTML = '<p class="empty">該当なし</p>'; return; }

  // 全件を一度にDOM化すると(select×280option×7000行超で)固まってしまうため、
  // 一度に描画するのは一部だけにして「もっと見る」で追加していく
  const page = items.slice(0, renderLimit);

  list.innerHTML = '';
  page.forEach((a) => {
    const s = state[a.artist] || {};
    const row = document.createElement('div');
    row.className = 'row' + (state[a.artist] ? ' done' : '');
    const releasesHtml = a.releases.map((r) =>
      `<a href="${r.url}" target="_blank" rel="noopener">${r.title}</a>${r.year ? ` (${r.year})` : ''}`
    ).join(' / ');
    row.innerHTML = `
      <input type="checkbox" ${s.include ? 'checked' : ''}>
      <div class="main">
        <div class="artist">${a.artist}</div>
        <p class="releases">${releasesHtml}</p>
        <div class="region">
          <select>${REGION_OPTIONS_HTML}</select>
          <input type="text" class="custom" list="regionNames" placeholder="候補に無ければ地名を直接入力" value="${s.custom || ''}">
        </div>
        <div class="pub">
          <span class="pubstat"></span>
          <button type="button" class="pubbtn"></button>
        </div>
      </div>`;
    const checkbox = row.querySelector('input[type="checkbox"]');
    const select = row.querySelector('select');
    if (s.regionId) select.value = s.regionId;
    const custom = row.querySelector('.custom');
    const pubstat = row.querySelector('.pubstat');
    const pubbtn = row.querySelector('.pubbtn');
    const refreshPubUi = () => {
      const isPublished = !!publishedMap[a.artist];
      pubstat.textContent = isPublished ? '● 公開済み' : '未公開';
      pubstat.classList.toggle('on', isPublished);
      pubbtn.textContent = isPublished ? '更新を反映' : '地図に公開';
      pubbtn.disabled = !checkbox.checked;
    };
    refreshPubUi();
    const commit = () => {
      const decision = { include: checkbox.checked, regionId: select.value || null, custom: custom.value.trim() || null };
      state[a.artist] = decision;
      save();
      pushDecision(a.artist, decision); // サーバーへ即時保存(他の人とも共有)
      row.classList.add('done');
      document.getElementById('stat').textContent = `${Object.keys(state).length}/${ARTISTS.length} 確認済み`;
      const cc = Object.values(state).filter((x) => x.include).length;
      document.getElementById('footerStat').textContent =
        `全${ARTISTS.length}組 / 確認済み${Object.keys(state).length} / 採用${cc}`;
      // 採用チェックを外したのに公開済みのままなら、自動で地図からも下げる
      if (!checkbox.checked && publishedMap[a.artist]) {
        unpublishArtist(a).then(refreshPubUi);
      } else {
        refreshPubUi();
      }
    };
    checkbox.addEventListener('change', commit);
    select.addEventListener('change', commit);
    custom.addEventListener('change', commit);
    pubbtn.addEventListener('click', async () => {
      pubbtn.disabled = true;
      pubstat.textContent = '公開中…';
      try {
        await publishArtist(a);
        refreshPubUi();
      } catch (e) {
        pubstat.textContent = `失敗: ${e.message}`;
        pubbtn.disabled = false;
      }
    });
    list.appendChild(row);
  });

  if (items.length > page.length) {
    const more = document.createElement('button');
    more.textContent = `さらに表示(残り${items.length - page.length}組)`;
    more.style.cssText = 'display:block; width:100%; margin-top:10px; padding:12px; font:inherit; font-weight:800; border:2px solid var(--ink); background:var(--paper); cursor:pointer;';
    more.addEventListener('click', () => { renderLimit += PAGE_SIZE; render(); });
    list.appendChild(more);
  }
}

document.getElementById('search').addEventListener('input', resetPageAndRender);
document.getElementById('filterMode').addEventListener('change', resetPageAndRender);
document.getElementById('yearMin').addEventListener('input', resetPageAndRender);
document.getElementById('yearMax').addEventListener('input', resetPageAndRender);
document.getElementById('styleFilter').addEventListener('change', resetPageAndRender);
document.getElementById('publishFilter').addEventListener('change', resetPageAndRender);
document.getElementById('publishAllBtn').addEventListener('click', async () => {
  const targets = lastFilteredItems.filter((a) => state[a.artist]?.include && !publishedMap[a.artist]);
  if (!targets.length) { publishStatusEl.textContent = '対象なし(表示中に未公開の採用ぶんが無い)'; return; }
  const btn = document.getElementById('publishAllBtn');
  btn.disabled = true;
  let ok = 0;
  let fail = 0;
  for (const a of targets) {
    publishStatusEl.textContent = `公開中… ${ok + fail + 1}/${targets.length}(${a.artist})`;
    try {
      await publishArtist(a);
      ok++;
    } catch (e) {
      fail++;
      console.error(a.artist, e);
    }
  }
  publishStatusEl.textContent = fail ? `完了: ${ok}件公開 / ${fail}件失敗(コンソール参照)` : `完了: ${ok}件公開しました`;
  btn.disabled = false;
  render();
});
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'review_result.json';
  a.click();
  URL.revokeObjectURL(url);
});

boot();
</script>
</body>
</html>
