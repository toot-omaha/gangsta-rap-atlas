<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GANGSTA RAP ATLAS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14120f">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icon/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon/icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=53">
</head>
<body>

<header id="topbar">
  <div class="brand" id="brandHome" title="再読み込み" role="button">
    <span class="brand-mark">◉</span>
    <div>
      <h1>GANGSTA RAP ATLAS</h1>
      <p>地図カラ掘ル、地域別ディスコグラフィ</p>
    </div>
  </div>
  <div id="drawer" class="drawer">
    <div id="eraFilter" class="era-filter"></div>
    <div id="tagFilter" class="tag-filter"></div>
    <div id="stampFilter" class="stamp-filter"></div>
    <p class="filter-hint">トークボックス/ネタモノは曲のスタンプ画面でチェックできます。<b>誰もチェックしていない曲はここでは見つかりません。</b>視聴後のスタンプ・チェックにご協力ください。</p>
    <div id="drawerActions" class="drawer-actions"></div>
  </div>
  <div class="top-actions">
    <button id="searchBtn" class="fav-toggle search" title="検索">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <line x1="15.4" y1="15.4" x2="21" y2="21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="favBtn" class="fav-toggle" title="お気に入りリスト">★ <span id="favCount">0</span></button>
    <button id="stampMenuBtn" class="stamp-menu-btn" title="絞り込み(年代・タグ・スタンプ)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M5 22 V10 a7 7 0 0 1 14 0 V22 Z" fill="currentColor"/>
        <rect x="3" y="21" width="18" height="2.5" fill="currentColor"/>
        <path d="M11 7.5 h2 v2.5 h2.8 v2 h-2.8 v6 h-2 v-6 H8.2 v-2 H11 Z" fill="var(--paper)"/>
      </svg>
    </button>
    <button id="submitBtn" class="fav-toggle submit" title="ディスク情報を投稿">✚ 投稿</button>
    <button id="langBtn" class="fav-toggle lang" title="Language">EN</button>
  </div>
</header>

<main id="stage">
  <div id="mapWrap">
    <div id="map"></div>
  </div>

  <div class="intro">
    <p>撃チ込メ ─ 地図ヲ クリック</p>
  </div>

  <div id="mask"></div>
  <div id="shot"><img src="assets/bullet-ink.png" alt=""></div>
  <section id="list"></section>

  <div id="searchOverlay" class="search-overlay">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="アーティスト・タイトルで検索" autocomplete="off">
      <button id="searchClose" class="close" title="閉じる">✕</button>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="stampOverlay" class="search-overlay stamp-overlay">
    <div class="stamp-box">
      <div class="stamp-box-head">
        <span id="stampOverlayTitle" class="stamp-overlay-title"></span>
        <button id="stampOverlayClose" class="close" title="閉じる">✕</button>
      </div>
      <div id="stampOverlayList" class="stamp-overlay-list"></div>
      <div id="stampOverlayTags" class="stamp-overlay-tags"></div>
    </div>
  </div>

</main>

<footer id="player" class="player">
  <div class="player-now">
    <div class="player-art">♪</div>
    <div class="player-meta">
      <strong id="playerTitle">再生キューハ空</strong>
      <span id="playerArtist">アルバムノ ▶ ヲ押ストキューニ入ル</span>
    </div>
  </div>
  <div class="player-controls">
    <button id="prevBtn" class="icon-btn" aria-label="前へ">⏮</button>
    <button id="playBtn" class="icon-btn play" aria-label="再生">▶</button>
    <button id="nextBtn" class="icon-btn" aria-label="次へ">⏭</button>
  </div>
  <div class="player-queue">
    <span id="queueCount">0 曲</span>
    <button id="clearQueue" class="text-btn">クリア</button>
    <span class="credit">試聴・ジャケ写: Apple Music</span>
  </div>
  <div id="ytHost" class="yt-host"></div>
</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="data.js?v=92"></script>
<script src="enrich.js?v=73"></script>
<script src="rarity.js?v=65"></script>
<script src="youtube.js?v=1"></script>
<script src="app.js?v=84"></script>
</body>
</html>
